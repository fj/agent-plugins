set -gF @agent_spinner '#{d:current_file}/tmux-spinner'
set -g @agent_badge '#{?@agent_state,#(#{@agent_spinner} #{@agent_state}) ,}'
set -g status-interval 1
set -g window-status-format '#I:#{E:@agent_badge}#W#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#{E:@agent_badge}#W#{?window_flags,#{window_flags}, }'
set-hook -g 'session-window-changed[42]' "if -F '#{m/r:^(done|waiting)$,#{@agent_state}}' 'set -wu @agent_state'"
